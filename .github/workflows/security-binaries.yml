name: Security binary rebuild

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-binaries.yml'
      - '.github/scripts/build-security-binary.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/security-binaries.yml'
      - '.github/scripts/build-security-binary.py'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.14.9'
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-wxgtk4.0 xvfb libssl3t64 openssl libpython3.12 python3.12
          /usr/bin/python3 -m venv --system-site-packages .binary-venv
      - name: Build and verify Windows binary
        if: runner.os == 'Windows'
        run: python .github/scripts/build-security-binary.py
      - name: Build and verify Linux binary
        if: runner.os == 'Linux'
        run: xvfb-run -a .binary-venv/bin/python .github/scripts/build-security-binary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yt-dlg-${{ runner.os }}-${{ github.sha }}
          path: security-dist/
          if-no-files-found: error
          retention-days: 30
