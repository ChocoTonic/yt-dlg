name: Tests
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install secure Python test tooling
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install "tox>=4" "virtualenv>=21.14.7"
      - name: Test, type check, lint and smoke-install
        run: python -m tox -e py311
